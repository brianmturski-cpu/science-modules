<body>
<div class="wrap">
<aside>
  <h1>Diffusion and Osmosis Explorer</h1>
  <p class="sub">Block 2.4 &middot; Work alone, top to bottom.</p>
  <ol id="toc"></ol>
</aside>
<main id="main"></main>
</div>
<script>
// Block 2.4 Diffusion and Osmosis Explorer: simulation engine.
// Pure functions with a seeded random number generator, so every student sees
// the same numbers and the answer key (computed in Node) matches the module.

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) {
  let u = 0, v = 0;
  while (u === 0) u = r();
  v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const BOX = { W: 640, H: 320, MID: 320 };
const DT = 0.1; // simulated seconds per step

// ---------------------------------------------------------------- diffusion
// 300 dye particles start in the left half. The barrier is lifted at t = 0.
const DIFF = {
  N: 300,
  warm: { label: "Warm water (40 °C)", sigma: 19, seed: 4011 },
  cold: { label: "Cold water (5 °C)", sigma: 11.8, seed: 5022 },
};
function diffInit(kind) {
  const P = DIFF[kind], r = rng(P.seed), pts = [];
  for (let i = 0; i < DIFF.N; i++) pts.push({ x: 4 + r() * (BOX.MID - 8), y: 4 + r() * (BOX.H - 8) });
  return { kind, r, sigma: P.sigma, pts, step: 0 };
}
function reflect(v, lo, hi) {
  if (v < lo) v = 2 * lo - v;
  if (v > hi) v = 2 * hi - v;
  return Math.min(hi, Math.max(lo, v));
}
function diffStep(s) {
  for (const p of s.pts) {
    p.x = reflect(p.x + s.sigma * gauss(s.r), 0, BOX.W);
    p.y = reflect(p.y + s.sigma * gauss(s.r), 0, BOX.H);
  }
  s.step++;
}
function diffRight(s) {
  let n = 0;
  for (const p of s.pts) if (p.x > BOX.MID) n++;
  return Math.round((100 * n) / DIFF.N);
}

// ---------------------------------------------------------------- membrane
// 40 molecules start on the left. When a move would cross the membrane, the
// molecule gets through with probability P, otherwise it bounces back.
const MOLS = {
  o2:  { name: "Oxygen (O₂)", note: "small, no charge", bare: 0.6, prot: 0.6, r: 4 },
  co2: { name: "Carbon dioxide (CO₂)", note: "small, no charge", bare: 0.6, prot: 0.6, r: 4.5 },
  h2o: { name: "Water (H₂O)", note: "small, polar", bare: 0.02, prot: 0.6, r: 3.5 },
  glu: { name: "Glucose", note: "large, polar", bare: 0, prot: 0.25, r: 7 },
  na:  { name: "Sodium ion (Na⁺)", note: "small, charged", bare: 0, prot: 0.3, r: 3.5 },
};
const MEM = { N: 40, sigma: 24, steps: 200 }; // 200 steps = 20 s
function memSeed(mol) { return { o2: 11, co2: 22, h2o: 33, glu: 44, na: 55 }[mol] * 100 + 7; }
function memInit(mol, prot) {
  const r = rng(memSeed(mol)), pts = [];
  for (let i = 0; i < MEM.N; i++) pts.push({ x: 6 + r() * (BOX.MID - 30), y: 6 + r() * (BOX.H - 12) });
  return { mol, prot, r, pts, step: 0, p: prot ? MOLS[mol].prot : MOLS[mol].bare };
}
function crossStep(s, sigma, pCross, pts) {
  for (const q of pts) {
    const nx = q.x + sigma * gauss(s.r);
    const ny = reflect(q.y + sigma * gauss(s.r), 0, BOX.H);
    const crosses = (q.x <= BOX.MID) !== (nx <= BOX.MID);
    const p = typeof pCross === "function" ? pCross(q) : pCross;
    if (crosses && !(s.r() < p)) q.x = reflect(2 * BOX.MID - nx, q.x <= BOX.MID ? 0 : BOX.MID, q.x <= BOX.MID ? BOX.MID : BOX.W);
    else {
      if (crosses) { if (q.x <= BOX.MID) s.lr = (s.lr || 0) + 1; else s.rl = (s.rl || 0) + 1; }
      q.x = reflect(nx, 0, BOX.W);
    }
    q.y = ny;
  }
  s.step++;
}
function memStep(s) { crossStep(s, MEM.sigma, s.p, s.pts); }
function memRight(s) { return s.pts.filter((p) => p.x > BOX.MID).length; }

// ---------------------------------------------------------------- osmosis
// Left: 140 water. Right: 80 water + 60 sugar. Same volume at the start.
// The membrane lets water through and stops sugar.
const OSM = { wl: 140, wr: 80, sugar: 60, sigma: 12, pw: 0.5, seed: 7031, steps: 600 }; // 60 s
function osmInit() {
  const r = rng(OSM.seed), pts = [];
  const add = (n, left, type) => { for (let i = 0; i < n; i++) pts.push({ type, x: left ? 6 + r() * (BOX.MID - 12) : BOX.MID + 6 + r() * (BOX.MID - 12), y: 6 + r() * (BOX.H - 12) }); };
  add(OSM.wl, true, "w"); add(OSM.wr, false, "w"); add(OSM.sugar, false, "s");
  return { r, pts, step: 0, lr: 0, rl: 0 };
}
function osmStep(s) { crossStep(s, OSM.sigma, (q) => (q.type === "w" ? OSM.pw : 0), s.pts); }
function osmCount(s) {
  const c = { wl: 0, wr: 0, sl: 0, sr: 0 };
  for (const p of s.pts) { const L = p.x <= BOX.MID; if (p.type === "w") L ? c.wl++ : c.wr++; else L ? c.sl++ : c.sr++; }
  return c;
}

// ---------------------------------------------------------------- potato cores
// Fixed data, one core per beaker. The isotonic point is about 0.28 M.
const POTATO = [
  { c: 0.0, m0: 2.48, m1: 2.93 },
  { c: 0.2, m0: 2.55, m1: 2.68 },
  { c: 0.4, m0: 2.51, m1: 2.29 },
  { c: 0.6, m0: 2.46, m1: 2.03 },
  { c: 0.8, m0: 2.53, m1: 1.97 },
  { c: 1.0, m0: 2.49, m1: 1.88 },
];
function pctChange(row) { return ((row.m1 - row.m0) / row.m0) * 100; }

if (typeof module !== "undefined") module.exports = { rng, gauss, BOX, DT, DIFF, diffInit, diffStep, diffRight, MOLS, MEM, memInit, memStep, memRight, OSM, osmInit, osmStep, osmCount, POTATO, pctChange };

</script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const done = {};
let cur = 0, anim = null;
function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; }
function loop(fn) { stopAnim(); const f = () => { if (fn() !== false) anim = requestAnimationFrame(f); else anim = null; }; anim = requestAnimationFrame(f); }
function canvas(w, h) { const c = document.createElement("canvas"); const d = Math.min(2, window.devicePixelRatio || 1); c.width = w * d; c.height = h * d; c.getContext("2d").scale(d, d); c._w = w; c._h = h; return c; }
function circle(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fillStyle = fill; g.fill(); }
function check(id, q, opts, right, why) {
  const box = document.createElement("div"); box.className = "check";
  box.innerHTML = `<b class="t">Check yourself: ${q}</b>` + opts.map((o, i) => `<label><input type="radio" name="${id}" value="${i}"> ${o}</label>`).join("") + `<div class="fb"></div>`;
  box.addEventListener("change", (e) => {
    const fb = $(".fb", box), ok = +e.target.value === right;
    fb.className = "fb " + (ok ? "ok" : "bad");
    fb.textContent = ok ? "Correct. " + why : "Not quite. Look at the simulation again and try another answer.";
    if (ok) { done[STEPS[cur].id] = true; toc(); }
  });
  return box;
}
function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d; }

// ---------------------------------------------------------------- steps
const STEPS = [
  { id: "start", part: "Start", title: "How this works", render: rStart },
  { id: "a", part: "A. Random motion", title: "A. Watch one particle", render: rBrown },
  { id: "b1", part: "B. Diffusion", title: "B1. Dye in warm water", render: (m) => rDiff(m, "warm") },
  { id: "b2", part: "B. Diffusion", title: "B2. Dye in cold water", render: (m) => rDiff(m, "cold") },
  { id: "c", part: "C. The membrane", title: "C. What gets through?", render: rMem },
  { id: "d", part: "D. Osmosis", title: "D. Water and sugar", render: rOsm },
  { id: "e1", part: "E. Potato lab", title: "E1. Weigh the cores", render: rPotato },
  { id: "e2", part: "E. Potato lab", title: "E2. Graph and check", render: rGraph },
  { id: "f", part: "F. Cells in solutions", title: "F. Red blood cell and plant cell", render: rTono },
  { id: "end", part: "Finish", title: "Finished", render: rEnd },
];
function toc() {
  const ol = $("#toc"); ol.innerHTML = ""; let last = "";
  STEPS.forEach((s, i) => {
    if (s.part !== last && s.part !== "Start" && s.part !== "Finish") { const p = document.createElement("li"); p.className = "part"; p.textContent = s.part; ol.appendChild(p); }
    last = s.part;
    const li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = `<span class="mark">${done[s.id] ? "✔" : i === cur ? "▶" : "○"}</span>${s.title}`;
    if (i === cur) b.className = "on";
    b.onclick = () => go(i); li.appendChild(b); ol.appendChild(li);
  });
}
function go(i) {
  stopAnim(); cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const m = $("#main"); m.innerHTML = "";
  const s = STEPS[cur];
  m.appendChild(el(`<div class="stepno">Step ${cur + 1} of ${STEPS.length}</div><h2>${s.title}</h2>`));
  s.render(m);
  const nav = el(`<div class="nav"><button class="btn ghost" id="back">&larr; Back</button><button class="btn" id="next">Next step &rarr;</button></div>`);
  m.appendChild(nav);
  $("#back").disabled = cur === 0; $("#next").disabled = cur === STEPS.length - 1;
  $("#back").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1);
  toc(); window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- start
function rStart(m) {
  m.appendChild(el(`
  <div class="do"><b class="t">Read this first</b>
  <ol>
   <li>You work <b>alone</b>, at your own pace, from Step 1 to Step ${STEPS.length}. Use the <b>Next step</b> button at the bottom of each page.</li>
   <li>Each step has a blue box like this one. It tells you exactly what to click.</li>
   <li>Yellow boxes tell you what to <b>write in your handout</b>. Every number you need is shown on the screen.</li>
   <li>The <b>Check yourself</b> questions give instant feedback. A check mark appears in the list on the left when you get one right.</li>
   <li>Every student sees the same numbers, so you can compare with a neighbor. Press <b>Start over</b> on any step to watch it again.</li>
  </ol></div>
  <p>Today's question: <b>how do molecules get into and out of a cell without the cell spending any energy?</b> This is called <b>passive transport</b>. It has three kinds: <b>simple diffusion</b>, <b>facilitated diffusion</b> (through proteins) and <b>osmosis</b> (water). You will see all three.</p>`));
  done.start = true;
}

// ---------------------------------------------------------------- A. Brownian motion
function rBrown(m) {
  m.appendChild(el(`<div class="do"><b class="t">Do this</b><ol>
   <li>Watch the large particle for about 20 seconds. The gray line is the path it has taken.</li>
   <li>Press <b>Show water molecules</b> to zoom in on what is hitting it.</li></ol></div>`));
  const stage = document.createElement("div"); stage.className = "stage";
  const c = canvas(640, 320); stage.appendChild(c);
  const ctrl = el(`<div class="ctrl"><button class="btn" id="tw">Show water molecules</button><button class="btn ghost" id="rs">Start over</button><span class="read" id="tm">0 s</span></div>`);
  stage.appendChild(ctrl); m.appendChild(stage);
  m.appendChild(el(`<div class="write">Part A, Q1: describe the path of the particle. Does it head in one direction?</div>`));
  m.appendChild(check("ca", "What makes the particle move?", ["It swims toward the light.", "Tiny water molecules hit it unevenly from every side.", "The water is flowing in one direction.", "It is pulled toward the edge."], 1, "Water molecules are always moving and bumping it. Each bump is random, so its path is random. This is called Brownian motion."));
  let r, x, y, trail, ws, t, show = false;
  const reset = () => { r = rng(99); x = 320; y = 160; trail = [[x, y]]; t = 0; ws = []; for (let i = 0; i < 260; i++) ws.push({ x: r() * 640, y: r() * 320, a: r() * 6.283 }); };
  reset();
  $("#tw", ctrl).onclick = (e) => { show = !show; e.target.textContent = show ? "Hide water molecules" : "Show water molecules"; };
  $("#rs", ctrl).onclick = reset;
  const g = c.getContext("2d");
  loop(() => {
    t++;
    x = Math.min(600, Math.max(40, x + 1.7 * gauss(r))); y = Math.min(290, Math.max(30, y + 1.7 * gauss(r)));
    trail.push([x, y]); if (trail.length > 1500) trail.shift();
    g.fillStyle = css("--fluid"); g.fillRect(0, 0, 640, 320);
    if (show) for (const w of ws) { w.a += (r() - 0.5) * 1.2; w.x = (w.x + 4 * Math.cos(w.a) + 640) % 640; w.y = (w.y + 4 * Math.sin(w.a) + 320) % 320; circle(g, w.x, w.y, 2.2, css("--water")); }
    g.strokeStyle = css("--muted"); g.lineWidth = 1.2; g.beginPath(); trail.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b))); g.stroke();
    circle(g, x, y, 14, css("--sugar"));
    $("#tm", ctrl).textContent = Math.floor(t / 60) + " s";
  });
}

// ---------------------------------------------------------------- B. Diffusion
const DIFF_REC = { warm: [0, 10, 20, 30, 40, 50, 60], cold: [0, 10, 20, 30, 40, 50, 60, 90, 120, 150, 180] };
function rDiff(m, kind) {
  const P = DIFF[kind], cold = kind === "cold";
  m.appendChild(el(`<div class="do"><b class="t">Do this</b><ol>
   <li>This box holds ${P.label.replace("W","w").replace("C","c").replace("°c","°C")}. It has <b>300 dye particles</b> on the left, held back by a barrier.</li>
   <li>Press <b>Remove the barrier</b>. The table fills in by itself every 10 seconds of simulated time.</li>
   ${cold ? "<li>When it stops at 60 s, press <b>Keep running to 180 s</b>.</li>" : ""}</ol></div>`));
  const stage = document.createElement("div"); stage.className = "stage";
  const c = canvas(640, 320); stage.appendChild(c);
  const ctrl = el(`<div class="ctrl"><button class="btn" id="go">Remove the barrier</button>${cold ? '<button class="btn" id="more" disabled>Keep running to 180 s</button>' : ""}<button class="btn ghost" id="rs">Start over</button><span class="read" id="rd"></span></div>`);
  stage.appendChild(ctrl);
  const cols = cold ? DIFF_REC.cold : DIFF_REC.warm;
  const tbl = el(`<table><tr><th>Time (s)</th>${cols.map((t) => `<th>${t}</th>`).join("")}</tr><tr><th>Dye on the right (%)</th>${cols.map((t) => `<td class="big" id="d${t}"></td>`).join("")}</tr></table>`);
  stage.appendChild(tbl); m.appendChild(stage);
  m.appendChild(el(`<div class="write">Table 1, row "${cold ? "Cold, 5 °C" : "Warm, 40 °C"}": copy every number in this table.${cold ? " Then answer Q3 and Q4." : " Then answer Q2."}</div>`));
  if (cold) m.appendChild(check("cb", "Compare the warm and cold runs. What did the cold water change?", ["Where the dye ended up (the cold run ends with less dye on the right).", "How fast the dye spread. Both runs head toward about 50% on each side.", "Nothing. The two runs are the same.", "The direction the dye moved."], 1, "Cold molecules move more slowly, so diffusion is slower. The end point is the same: an even spread."));
  let s, target, running = false;
  const g = c.getContext("2d");
  const draw = (barrier) => {

    g.fillStyle = css("--vac"); g.strokeStyle = css("--accent"); g.lineWidth = 2.5;
    const rx = px + inset, ry = py + inset * (sol === "hyper" ? 0.8 : 1);
    g.beginPath(); g.roundRect ? g.roundRect(rx, ry, W - 2 * inset, H - 2 * inset * (sol === "hyper" ? 0.8 : 1), sol === "hyper" ? 40 : 8) : g.rect(rx, ry, W - 2 * inset, H - 2 * inset); g.fill(); g.stroke();
    g.strokeStyle = css("--wall"); g.lineWidth = 8; g.strokeRect(px, py, W, H);
    // arrows
    g.strokeStyle = css("--water"); g.fillStyle = css("--water"); g.lineWidth = 4;
    const arrow = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); const a = Math.atan2(y2 - y1, x2 - x1); g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - 12 * Math.cos(a - 0.45), y2 - 12 * Math.sin(a - 0.45)); g.lineTo(x2 - 12 * Math.cos(a + 0.45), y2 - 12 * Math.sin(a + 0.45)); g.fill(); };
    for (const [ox, oy, ix, iy] of [[20, 150, 70, 150], [300, 150, 250, 150], [340, 150, 380, 150], [620, 150, 580, 150]]) {
      if (k === 1) arrow(ox, oy, ix, iy); else if (k === -1) arrow(ix, iy, ox, oy); else { arrow(ox, oy - 8, ix, iy - 8); arrow(ix, iy + 8, ox, oy + 8); }
    }
    g.fillStyle = css("--ink"); g.font = "bold 14px system-ui"; g.textAlign = "center"; g.fillText("Red blood cell", 160, 290); g.fillText("Plant cell", 470, 290); g.textAlign = "left";
  };
  ctrl.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return; sol = b.dataset.s;
    ctrl.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b));
    info.innerHTML = ""; let t = 0;
    loop(() => { t += 1 / 90; draw(t); if (t >= 1.7) { info.innerHTML = TXT[sol].join("<br>"); return false; } });
  };
  draw(0);
}

// ---------------------------------------------------------------- end
function rEnd(m) {
  const list = STEPS.filter((s) => s.id !== "start" && s.id !== "end");
  m.appendChild(el(`<p>Your checklist. A check mark means you got that step's check question right (or finished all 6 potato calculations).</p><table><tr><th>Step</th><th>Done</th></tr>${list.map((s) => `<tr><td style="text-align:left">${s.title}</td><td class="big">${done[s.id] ? "✔" : "&mdash;"}</td></tr>`).join("")}</table>
  <div class="write">Finish any blank table or question in your handout. Then start the exit ticket only when your teacher says so.</div>`));
}

go(0);
</script>
